; PixelEngine LLM BOT 配置
; 首次启动时从 assets/config/llm.ini 读取，之后使用 exe 同目录下的副本

[server]
; llama-server HTTP 地址
url=http://127.0.0.1:9931

[launcher]
; 是否自动拉起 llama-server (1=是, 0=否)
auto_launch=1
; llama-server.exe 路径 (相对于 exe 目录 或 绝对路径)
exe=llm_bot\llama.cpp\llama-server.exe
; 模型文件路径 (相对于 exe 目录 或 绝对路径)
model=llm_bot\models\qwen2.5-7b-instruct-q4_k_m.gguf
; GPU 全卸载层数 (-1=自动根据 VRAM, 0=纯CPU, 99=全部GPU)
ngl=99
; 启动后等待模型加载的最长时间 (秒)
startup_wait=20