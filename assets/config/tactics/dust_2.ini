# dust_2 战术表
# 说明见 PixelEngine/CS2D/Coach/TacticsTable.hpp
# [areas]        教练代码里的关键词 → 地图 TMJ 的实际区域名
# [slots.<队伍>.<意图>]  槽位序号 = 角色|区域别名[|noTrade][|rotate]

[areas]
A_Site  = A_Site
B_Site  = B_Site
Mid     = Mid
Long    = Long
Short   = Short
Tunnel  = Tunnel

# T 默认分兵：Long 突破 / A 点支援 / Mid 游走 / B 洞断后 / B 点支援
[slots.T.Default]
0 = Entry|Long
1 = Support|A_Site
2 = Lurk|Mid|rotate
3 = Anchor|Tunnel
4 = Support|B_Site

# CT 默认守点：A 点锚点 / A 短支援 / 中路游走 / B 点锚点 / B 洞支援
[slots.CT.Default]
0 = Anchor|A_Site
1 = Support|Short
2 = Entry|Mid|rotate
3 = Anchor|B_Site
4 = Support|Tunnel

# T 速推 A：全员 Long 压点，末尾一人守 A
[slots.T.RushA]
0 = Entry|Long
1 = Entry|Long
2 = Entry|Long
3 = Entry|Long
4 = Anchor|A_Site

# T 速推 B：全员 Tunnel 压点，末尾一人守 B
[slots.T.RushB]
0 = Entry|Tunnel
1 = Entry|Tunnel
2 = Entry|Tunnel
3 = Entry|Tunnel
4 = Anchor|B_Site
