# ancient_ruins 战术表
#
# 注意：旧代码用 AreaHint("Long") 做"子串第一个命中"，而这张图的图层顺序里
# B_Long / B_Short 排在 A_Long / A_Short 之前，导致 A 侧的突破点被解析成 B 侧。
# 战术表按 A/B 明确指定，顺带修正了这个歧义。

[areas]
A_Site = A_Site
B_Site = B_Site
Mid    = Mid
# 先与旧行为保持一致（旧代码的子串匹配实际落到 B 侧）；A/B 侧纠正是调参项，单独验证后再改
Long   = B_Long
Short  = B_Short
Tunnel = Cave        # T33：真实区域，不再回退包点（与 Long/Short 同取 B 侧）

[slots.T.Default]
0 = Entry|Long
1 = Support|A_Site
2 = Lurk|Mid|rotate
3 = Anchor|Tunnel
4 = Support|B_Site

[slots.CT.Default]
0 = Anchor|A_Site
1 = Support|Short
2 = Entry|Mid|rotate
3 = Anchor|B_Site
4 = Support|Tunnel

[slots.T.RushA]
0 = Entry|Long
1 = Entry|Long
2 = Entry|Long
3 = Entry|Long
4 = Anchor|A_Site

[slots.T.RushB]
0 = Entry|Tunnel
1 = Entry|Tunnel
2 = Entry|Tunnel
3 = Entry|Tunnel
4 = Anchor|B_Site

# T09：转点走表——RotateA/RotateB 表段（规则 CoachTryRotate 发 Rotate 意图时命中）。
[slots.T.RotateA]
0 = Entry|A_Site
1 = Support|A_Site
2 = Anchor|A_Site
3 = Lurk|Mid|rotate
4 = Support|Mid

[slots.T.RotateB]
0 = Entry|B_Site
1 = Support|B_Site
2 = Anchor|B_Site
3 = Lurk|Mid|rotate
4 = Support|Mid
