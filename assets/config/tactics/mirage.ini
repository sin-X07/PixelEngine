# mirage 战术表
# 这张图没有 Long / Short / Tunnel 图层，旧代码靠关键字扫描会回退到包点中心。
# 这里显式写回退值，保证行为可预期；后续要细化战术，把值改成 Cat / Palace / Ramp 等真实区域即可。

[areas]
A_Site = A_Site
B_Site = B_Site
Mid    = Mid
Long   = A_Site    # TODO(战术调参): 可改为 Palace / Ramp
Short  = A_Site    # TODO(战术调参): 可改为 Cat
Tunnel = B_Site    # TODO(战术调参): 可改为 B_Apts / Kitchen

[slots.T.Default]
0 = Entry|Long
1 = Support|A_Site
2 = Lurk|Mid|rotate
3 = Anchor|Tunnel
4 = Support|B_Site

[slots.CT.Default]
0 = Anchor|A_Site
1 = Support|Short
2 = Entry|Mid|rotate
3 = Anchor|B_Site
4 = Support|Tunnel

[slots.T.RushA]
0 = Entry|Long
1 = Entry|Long
2 = Entry|Long
3 = Entry|Long
4 = Anchor|A_Site

[slots.T.RushB]
0 = Entry|Tunnel
1 = Entry|Tunnel
2 = Entry|Tunnel
3 = Entry|Tunnel
4 = Anchor|B_Site
